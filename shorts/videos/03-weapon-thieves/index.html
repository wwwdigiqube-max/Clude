<!doctype html>
<html><head><meta charset="utf-8"><title>03 Weapon thieves</title>
<style>
@font-face{font-family:'Luckiest Guy';src:url(../../node_modules/@fontsource/luckiest-guy/files/luckiest-guy-latin-400-normal.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.cap{position:absolute;left:50%;top:1330px;text-align:center;white-space:nowrap;font-family:'Luckiest Guy';font-size:96px;color:#fff;
  -webkit-text-stroke:16px #000;paint-order:stroke fill;text-shadow:0 9px 0 rgba(0,0,0,.6);letter-spacing:2px;transform-origin:50% 50%}
.lbl{position:absolute;font-family:'Luckiest Guy';font-size:54px;color:#111;background:#fff;border:7px solid #111;border-radius:18px;padding:8px 22px 2px;white-space:nowrap;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.comic{position:absolute;font-family:'Luckiest Guy';color:#FFE14D;-webkit-text-stroke:18px #111;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.5);white-space:nowrap}
</style>
<script src="../../engine/assets.js"></script>
<script src="../../engine/characters.js"></script>
<script src="audio/timing.js"></script>
</head><body><div id="stage"></div>
<script>
const A = Assets, C = Characters, K = '#111';

// ---------------- puppets ----------------
const CRAB = { img: 'img/crab_specimen.png', w: 1735, h: 1141, parts: [
  { name: 'body', clip: [[0,0],[280,0],[280,220],[470,320],[620,280],[600,0],[1110,0],[1120,270],[1260,320],[1440,220],[1450,0],[1735,0],[1735,1141],[0,1141]] },
  { name: 'clawL', clip: [[280,0],[600,0],[620,280],[470,320],[280,220]], pivot: [560, 270] },
  { name: 'clawR', clip: [[1110,0],[1450,0],[1440,220],[1260,320],[1120,270]], pivot: [1160, 260] } ] };
const OCTJ = { img: 'img/octo_juvenile.png', w: 1496, h: 2193, parts: [
  { name: 'body', clip: [[0,0],[940,0],[940,700],[1000,950],[940,2193],[0,2193]] },
  { name: 'tent', clip: [[940,0],[1496,0],[1496,2193],[940,2193],[1000,950],[940,700]], pivot: [1150, 880] } ] };
const OCTB = { img: 'img/octo_blanket.png', w: 1538, h: 1455, parts: [{ name: 'body' }] };
const WHIP = { img: 'img/whip.png', w: 464, h: 1290, parts: [{ name: 'body' }] };
const GLAU = { img: 'img/glaucus.png', w: 1080, h: 1006, parts: [{ name: 'body' }] };
const MOW = { img: 'img/manowar.png', w: 858, h: 1286, parts: [
  { name: 'tent', clip: [[0,450],[858,450],[858,1286],[0,1286]], pivot: [330, 470] },
  { name: 'float', clip: [[0,0],[858,0],[858,480],[0,480]] } ] };
const FISHF = { img: 'img/fish_front.png', w: 1556, h: 1413, parts: [{ name: 'body' }] };
const FISHS = { img: 'img/fish_side.png', w: 1738, h: 646, parts: [{ name: 'body' }] };

const eyeA = (o, x, y, w, extra = {}) => Object.assign({ svg: A.eyes(o), x, y, w }, extra);
const anemoneAt = (x, y, w, t, extra = {}) => Object.assign({ svg: A.anemone({ t, half: extra.half || 0 }), x, y, w }, extra);

function crab(H, E, t, o) {
  const a = o.anemones === false ? [] : null;
  const aL = o.aL === false ? null : anemoneAt(430, 40, 250, t, { scale: o.aLs ?? 1, half: o.aLhalf || 0, rot: -10 });
  const aR = o.aR === false ? null : anemoneAt(1240, 30, 250, t + 1, { scale: o.aRs ?? 1, half: o.aRhalf || 0, rot: 10 });
  return H.puppet(CRAB, { x: o.x, y: o.y, scale: o.scale ?? 0.55, rot: o.rot || 0, sx: o.sx, sy: o.sy, blur: o.blur,
    parts: {
      body: { attach: [eyeA({ variant: o.eye || 'normal', look: o.look || [0, 0.3], blink: o.blink || 0 }, 860, 300, 400, { scale: o.eyePop ?? 1 }), ...(o.attach || [])] },
      clawL: { rot: o.cl || 0, attach: [aL, ...(o.attachL || [])] },
      clawR: { rot: o.cr || 0, attach: [aR, ...(o.attachR || [])] } } });
}
function octJ(H, E, t, o) {
  return H.puppet(OCTJ, { x: o.x, y: o.y, scale: o.scale ?? 0.5, rot: o.rot || 0, flip: o.flip, blur: o.blur, sx: o.sx, sy: o.sy,
    parts: { body: { attach: [eyeA({ variant: o.eye || 'normal', look: o.look || [0.4, 0], blink: o.blink || 0 }, 470, 880, 320, { scale: o.eyePop ?? 1 }), ...(o.attach || [])] },
             tent: { rot: o.tent || 0, attach: o.attachT || [] } } });
}
function octB(H, E, t, o) {
  let whip = '';
  if (o.whip !== undefined) {
    // arm tip at image (215,1185); puppet centre (769,727)
    const sc = o.scale ?? 0.66, r = (o.rot || 0) * Math.PI / 180, dx = (215 - 769) * sc, dy = (1185 - 727) * sc;
    const wx = o.x + dx * Math.cos(r) - dy * Math.sin(r), wy = o.y + dx * Math.sin(r) + dy * Math.cos(r);
    whip = H.puppet(WHIP, { x: wx, y: wy, anchor: [210, 0], scale: sc * 0.95, rot: o.whip, blur: o.whipBlur || 0, parts: {} });
  }
  return whip + H.puppet(OCTB, { x: o.x, y: o.y, scale: o.scale ?? 0.66, rot: o.rot || 0, sx: o.sx, sy: o.sy, blur: o.blur,
    parts: { body: { attach: [eyeA({ variant: o.eye || 'normal', look: o.look || [-0.3, 0.2], blink: o.blink || 0 }, 515, 690, 250, { scale: o.eyePop ?? 1 }), ...(o.attach || [])] } } });
}
function glau(H, E, t, o) {
  return H.puppet(GLAU, { x: o.x, y: o.y, scale: o.scale ?? 0.8, rot: o.rot || 0, flip: o.flip, sx: o.sx, sy: o.sy, blur: o.blur,
    parts: { body: { attach: [eyeA({ variant: o.eye || 'normal', look: o.look || [0.3, 0.3], blink: o.blink || 0 }, 760, 585, 190, { rot: -35, scale: o.eyePop ?? 1 }), ...(o.attach || [])] } } });
}
function mow(H, E, t, o) {
  const sway = 3 * Math.sin(t * 2.2);
  return H.puppet(MOW, { x: o.x, y: o.y, scale: o.scale ?? 0.62, rot: o.rot || 0, sx: o.sx, sy: o.sy, opacity: o.opacity,
    parts: { float: { attach: [eyeA({ variant: o.eye || 'normal', look: o.look || [0, 0.3], blink: o.blink || 0 }, 520, 250, 260, { scale: o.eyePop ?? 1 }), ...(o.attach || [])] },
             tent: { rot: sway + (o.tentRot || 0), dx: o.tentDx || 0, dy: o.tentDy || 0, tint: o.tentHide ? 'opacity(0)' : '' } } });
}
function fishF(H, E, t, o) {
  return H.puppet(FISHF, { x: o.x, y: o.y, scale: o.scale ?? 0.6, rot: o.rot || 0, blur: o.blur,
    parts: { body: { attach: [eyeA({ variant: o.eye || 'normal', look: o.look || [0, 0.4], white: o.white || '#fff' }, 300, 760, 440)] } } });
}
function fishS(H, E, t, o) {
  return H.puppet(FISHS, { x: o.x, y: o.y, scale: o.scale ?? 0.55, rot: o.rot || 0, flip: o.flip, blur: o.blur,
    parts: { body: { attach: [eyeA({ variant: o.eye || 'normal', look: o.look || [-0.5, 0], white: o.white || '#fff' }, 270, 300, 230), ...(o.attach || [])] } } });
}
const lensy = (H, x, y, w, o = {}) => H.sticker(C.lensy({ mood: o.mood || 'happy', pose: o.pose || 'point', look: o.look || [0.4, 0.1], t: o.t || 0 }), x, y, w, o);

// ---------------- backgrounds ----------------
function ocean(t, light = 0) {
  let rays = '';
  for (let i = 0; i < 4; i++) rays += `<div style="position:absolute;left:${120 + i * 250}px;top:-200px;width:${110 + i * 25}px;height:1500px;transform:rotate(${14 - i * 6}deg);transform-origin:50% 0;background:linear-gradient(180deg, rgba(255,255,255,${0.07 + 0.03 * Math.sin(t * 1.3 + i)}) 0%, rgba(255,255,255,0) 100%);filter:blur(10px)"></div>`;
  let dots = '';
  for (let i = 0; i < 34; i++) {
    const x = (i * 263) % 1080, sp = 25 + (i * 17) % 40, y = 1920 - ((t * sp + i * 211) % 2000);
    dots += `<div style="position:absolute;left:${x + 14 * Math.sin(t + i)}px;top:${y}px;width:${4 + (i % 4) * 3}px;height:${4 + (i % 4) * 3}px;border-radius:50%;background:rgba(255,255,255,${0.25 + (i % 3) * 0.12})"></div>`;
  }
  return `<img src="img/${light ? 'bg_surface' : 'bg_ocean'}.jpg" style="position:absolute;left:-30px;top:${-40 + 8 * Math.sin(t * .4)}px;width:1140px;height:2000px;object-fit:cover">${rays}${dots}`;
}
function lineupWall() {
  let lines = '';
  for (let i = 0; i < 14; i++) lines += `<div style="position:absolute;left:0;top:${180 + i * 85}px;width:1080px;height:${i % 2 ? 3 : 6}px;background:rgba(255,255,255,${i % 2 ? .25 : .45})"></div>
    ${i % 2 ? '' : `<div style="position:absolute;left:24px;top:${150 + i * 85}px;font:28px 'Luckiest Guy';color:rgba(255,255,255,.6)">${(14 - i) * 10}</div>`}`;
  return `<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, #6E7C8F 0%, #46505F 70%, #2E3540 100%)"></div>${lines}`;
}
function seabed(t) { return `<img src="img/bg_seabed.jpg" style="position:absolute;left:${-30 + 10 * Math.sin(t * .3)}px;top:-40px;width:1140px;height:2000px;object-fit:cover">`; }

// real crab photo, cropped vertically; overlays in image coords
function realCrab(t, E, cam, overlays) {
  const IW = 1920, IH = 1441, s = 1920 / cam.h, cw = 1080 / s, ox = cam.cx - cw / 2, oy = cam.cy - cam.h / 2;
  let h = `<img src="img/src/crab_real.jpg" style="position:absolute;left:${-ox * s}px;top:${-oy * s}px;width:${IW * s}px;height:${IH * s}px;filter:saturate(1.2) contrast(1.08)">`;
  for (const o of overlays) {
    if (!o || o.scale === 0) continue;
    const x = (o.x - ox) * s, y = (o.y - oy) * s;
    h += window.H.sticker(o.svg, x, y, o.w * s, o);
  }
  return h;
}
const label = (text, x, y, scale = 1, rot = -3) => scale > 0 ? `<div class="lbl" style="left:${x}px;top:${y}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${scale})">${text}</div>` : '';
const comic = (text, x, y, size, scale = 1, rot = -8) => scale > 0 ? `<div class="comic" style="left:${x}px;top:${y}px;font-size:${size}px;transform:translate(-50%,-50%) rotate(${rot}deg) scale(${scale})">${text}</div>` : '';
const arrowSvg = `<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" overflow="visible"><path d="M10 20 Q100 0 160 80" fill="none" stroke="#111" stroke-width="22" stroke-linecap="round"/><path d="M10 20 Q100 0 160 80" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M128 86 L168 96 L170 54" fill="none" stroke="#111" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 86 L168 96 L170 54" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// lens ring without a face (Lensy used as a real magnifier)
function lensRing() {
  return `<svg viewBox="-40 -40 480 700" xmlns="http://www.w3.org/2000/svg" overflow="visible">
    <rect x="170" y="370" width="60" height="210" rx="28" fill="#8A4B2A" stroke="${K}" stroke-width="9"/>
    <rect x="154" y="338" width="92" height="52" rx="14" fill="#5C5F66" stroke="${K}" stroke-width="9"/>
    <circle cx="200" cy="200" r="158" fill="none" stroke="${K}" stroke-width="48"/><circle cx="200" cy="200" r="158" fill="none" stroke="#FF7A1A" stroke-width="30"/>
    <path d="M95 120 A120 120 0 0 1 170 70" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".7"/></svg>`;
}

// ---------------- script → word captions ----------------
const SEG = [
  [0.1, 4.1, "THESE THREE ANIMALS DON'T HAVE WEAPONS... SO THEY *STEAL* THEM."],
  [4.2, 6.2, 'NUMBER ONE: THE BOXER CRAB.'],
  [6.3, 9.3, "ITS CLAWS ARE WAY TOO *WEAK* TO FIGHT,"],
  [9.4, 14.5, 'SO IT GRABS TWO *VENOMOUS* SEA ANEMONES AND WAVES THEM LIKE BOXING GLOVES.'],
  [14.6, 15.5, 'LOSE ONE?'],
  [15.6, 19.8, 'IT *RIPS* THE OTHER IN HALF — AND BOTH HALVES GROW BACK.'],
  [19.9, 21.1, '*INFINITE* *AMMO.*'],
  [21.2, 23.3, 'NUMBER TWO: THE BLANKET OCTOPUS.'],
  [23.4, 26.4, "IT'S *IMMUNE* TO THE PORTUGUESE MAN O' WAR,"],
  [26.5, 31.3, 'SO IT TEARS OFF ITS STINGING TENTACLES AND SWINGS THEM LIKE *WHIPS.*'],
  [31.4, 33.7, 'AND NUMBER THREE: THE BLUE DRAGON.'],
  [33.8, 37.8, "IT EATS THE MAN O' WAR ALIVE, KEEPS ITS STINGERS,"],
  [37.9, 42.9, 'AND STORES THEM IN ITS OWN FINGERTIPS — MAKING ITS STING EVEN *STRONGER.*'],
  [43.0, 47.4, "HONESTLY, THE MAN O' WAR NEEDS BETTER *SECURITY.*"],
];
function buildCaptions() {
  const caps = [];
  for (const [t0, t1, text] of SEG) {
    const raw = text.replace(/—/g, '').split(/\s+/).filter(Boolean);
    // glue very short words to the next one ("A", "OF", "IN"...)
    const words = [];
    for (let i = 0; i < raw.length; i++) {
      if (raw[i].replace(/[^A-Z']/g, '').length <= 2 && i + 1 < raw.length && words.length < 99) { words.push(raw[i] + ' ' + raw[i + 1]); i++; }
      else words.push(raw[i]);
    }
    const wt = words.map((w) => w.length + 2), tot = wt.reduce((a, b) => a + b, 0);
    let t = t0;
    words.forEach((w, i) => { const d = ((t1 - t0) * wt[i]) / tot; const pop = w.includes('*'); caps.push([t, t + d, w.replace(/\*/g, ''), { pop }]); t += d; });
  }
  return caps;
}

// ---------------- shots ----------------
window.VIDEO = {
  duration: window.AUDIO_DURATION || 48, fps: 60, timeMap: window.TIMEMAP,
  images: { w: 'img/whip.png', o: 'img/bg_ocean.jpg', s: 'img/bg_surface.jpg', a: CRAB.img, b: OCTJ.img, c: OCTB.img, d: GLAU.img, e: MOW.img, f: FISHF.img, g: FISHS.img, h: 'img/src/crab_real.jpg', i: 'img/bg_seabed.jpg' },
  captions: window.WORDCAPS || buildCaptions(),
  shots: [
    // A — the line-up: three thieves
    { start: 0, end: 4.2, noPunch: true, bg: () => lineupWall(),
      camera: (t, E) => { const [x, y] = t > 2.95 && t < 3.4 ? E.shake(t, 12) : [0, 0]; return { x, y, zoom: 1 + 0.03 * t }; },
      draw: (t, E, H) => {
        const shifty = [Math.sin(t * 2.4) > 0 ? 0.8 : -0.8, 0.1];
        const plac = (n, x, s) => H.sticker(A.badge(n), x, 1210, 120, { scale: s });
        const caught = t > 2.95;
        return [
          crab(H, E, t, { x: 205, y: 900, scale: 0.25, sy: E.breathe(t, 0.02), eyePop: E.spring(t, 0.25, 0.5), look: shifty, eye: caught ? 'shocked' : 'normal', attachL: [{ svg: A.targetCircle(), x: 440, y: 60, w: 520, scale: E.pop(t, 3.0) }] }),
          octB(H, E, t, { x: 560, y: 790, scale: 0.3, sy: E.breathe(t + 1, 0.02), eyePop: E.spring(t, 0.55, 0.5), look: shifty, eye: caught ? 'shocked' : 'normal', whip: 18 + 5 * Math.sin(t * 2) }),
          caught ? H.sticker(A.targetCircle(), 430, 920, 190, { scale: E.pop(t, 3.1) }) : '',
          glau(H, E, t, { x: 885, y: 930, scale: 0.4, rot: -20, sy: E.breathe(t + 2, 0.02), eyePop: E.spring(t, 0.85, 0.5), look: shifty, eye: caught ? 'shocked' : 'normal', attach: [{ svg: A.targetCircle(), x: 511, y: 415, w: 480, scale: E.pop(t, 3.2) }] }),
          plac(1, 205, E.pop(t, 0.35)), plac(2, 545, E.pop(t, 0.65)), plac(3, 885, E.pop(t, 0.95)),
          comic('THIEVES!', 540, 300, 150, E.pop(t, 3.0), -6),
        ];
      },
      post: (t, E, H) => [H.flash('#FF2030', t > 2.95 && t < 2.99 ? 0.45 : 0)] },

    // B — #1 the boxer crab (real photo)
    { start: 4.2, end: 6.3, bg: () => '', draw: (t, E, H) => {
        const cam = { cx: E.lerp(990, 1010, t / 2), cy: E.lerp(700, 680, t / 2), h: E.lerp(1300, 1050, E.inOut(t / 2.1)) };
        return [realCrab(t, E, cam, [
          { svg: A.eyes({ variant: 'angry', look: [0, 0.4] }), x: 950, y: 605, w: 210, scale: E.spring(t, 0.15, 0.5) },
          { svg: A.targetCircle(), x: 926, y: 905, w: 230, scale: E.pop(t, 0.6) },
          { svg: A.targetCircle(), x: 1234, y: 820, w: 230, scale: E.pop(t, 0.75) },
        ]), label('BOXER CRAB', 540, 300, E.pop(t, 0.3)), H.sticker(arrowSvg, 700, 420, 200, { scale: E.pop(t, 0.45), rot: 20 }),
          H.sticker(A.badge(1), 130, 160, 170, { scale: E.spring(t, 0.05, 0.5) })];
      } },

    // C — claws way too weak (teal anatomy)
    { start: 6.3, end: 9.4, bg: (t, E, H) => H.tealBg(1 + 0.02 * t), draw: (t, E, H) => {
        const feeble = 6 * Math.sin(t * 9);
        return [
          crab(H, E, t, { x: 560, y: 760, scale: 0.6, aL: false, aR: false, eye: 'sad', look: [0, -0.6], cl: feeble, cr: -feeble, sy: E.breathe(t, 0.015) }),
          H.sticker(A.targetCircle(), 300, 520, 200, { scale: E.pop(t, 0.5) }), H.sticker(A.targetCircle(), 765, 510, 200, { scale: E.pop(t, 0.6) }),
          label('WEAK', 540, 320, E.spring(t, 1.1, 0.5), 6).replace('color:#111', 'color:#fff').replace('class="lbl" style="', 'class="lbl" style="background:#E5202E;color:#fff;'),
          lensy(H, 150, 1150, 260, { scale: E.spring(t, 1.6, 0.5), pose: 'point', mood: 'shock', look: [0.5, -0.5], rot: -10 }),
        ];
      } },

    // D — grabs anemones, boxing gloves, fish attack, fight, fish flees
    { start: 9.4, end: 14.6, bg: (t) => seabed(t),
      camera: (t, E) => { const [x, y] = t > 3.4 && t < 4.4 ? E.shake(t, 16, 19) : [0, 0]; return { x, y }; },
      draw: (t, E, H) => {
        const box = t > 0.6 ? Math.sin(t * 7) : 0;
        const items = [];
        const fishIn = E.prog(t, 2.2, 1.2), fight = t > 3.4 && t < 4.4, flee = E.inn(E.prog(t, 4.4, 0.6));
        // fish approaching from the deep (over-the-shoulder)
        if (t > 2.2 && t < 3.45) items.push(fishF(H, E, t, { x: 560 + 30 * Math.sin(t * 3), y: 420 + 120 * fishIn, scale: 0.15 + 0.3 * E.out(fishIn), look: [0, 0.6] }));
        if (!fight) items.push(crab(H, E, t, { x: 540 + 30 * box, y: 980, scale: 0.6, rot: 4 * box, eye: t > 2.6 ? 'angry' : 'normal', look: [0, -0.5],
          aLs: E.spring(t, 0.15, 0.45), aRs: E.spring(t, 0.35, 0.45), cl: t > 0.6 ? 14 * Math.sin(t * 14) : 0, cr: t > 0.6 ? -14 * Math.sin(t * 14 + 1.5) : 0 }));
        if (t > 2.2 && t < 3.45) items.push(H.sticker(A.warning(), 560, 250 + 120 * fishIn, 90, { scale: E.pop(t, 2.5) }));
        // equation: glove + poison
        if (t > 0.8 && t < 2.3) {
          items.push(H.sticker(A.iconDisc(A.glove()), 380, 330, 190, { scale: E.pop(t, 0.9) }), H.sticker(A.plus(), 540, 330, 70, { scale: E.pop(t, 1.1) }),
            H.sticker(A.iconDisc(A.poison()), 700, 330, 190, { scale: E.pop(t, 1.3) }));
        }
        if (fight) {
          items.push(H.sticker(A.fightCloud(t), 545 + 10 * Math.sin(t * 37), 820, 860, { scale: E.spring(t, 3.4, 0.4), rot: 4 * Math.sin(t * 21) }));
          for (let i = 0; i < 8; i++) { const ph = t - 3.5 - i * 0.07; if (ph < 0) continue; const p = (ph % 0.5) / 0.5, a = i * 2.39 + Math.floor(ph / 0.5);
            items.push(H.sticker(i % 2 ? A.star() : A.poison(), 545 + Math.cos(a) * (240 + 380 * p), 820 + Math.sin(a) * (200 + 330 * p), i % 2 ? 70 : 60, { scale: 1.1 - p, rot: p * 300 })); }
        }
        if (t >= 4.4) {
          items.push(crab(H, E, t, { x: 540, y: 980, scale: 0.6, eye: 'angry', look: [0.6, -0.3] }));
          items.push(fishS(H, E, t, { x: E.lerp(560, 1700, flee), y: 520, scale: 0.42, flip: true, blur: 70 * flee, eye: 'shocked', white: '#9BF06A', look: [0.6, 0],
            attach: [{ svg: A.exclaim(), x: 250, y: -40, w: 60 }] }));
        }
        return items;
      },
      post: (t, E, H) => [H.flash('#FF2030', t > 3.4 && t < 3.434 ? 0.5 : 0)] },

    // E — lose one?
    { start: 14.6, end: 15.6, bg: (t, E, H) => H.tealBg(), draw: (t, E, H) => {
        const fly = E.prog(t, 0.1, 0.5);
        return [crab(H, E, t, { x: 560, y: 820, scale: 0.6, eye: t > 0.25 ? 'shocked' : 'normal', look: [-0.7, -0.6], aL: false, aRs: 1 }),
          fly < 1 ? H.sticker(A.anemone({ t }), E.lerp(300, -300, fly), E.lerp(520, 150, fly), 170, { rot: -400 * fly }) : '',
          H.sticker(A.speedLines(), E.lerp(400, -100, fly), 560, 220, { rot: 200, opacity: fly > 0 && fly < 1 ? 1 : 0 })];
      } },

    // F — rip in half, both halves grow back
    { start: 15.6, end: 19.9, bg: (t, E, H) => H.tealBg(1 + 0.01 * t),
      camera: (t, E) => { const [x, y] = t > 1.0 && t < 1.35 ? E.shake(t, 10) : [0, 0]; return { x, y }; },
      draw: (t, E, H) => {
        const ripped = t > 1.0;
        const slide = E.out(E.prog(t, 1.0, 0.7));
        const grow = E.spring(t, 2.0, 0.8);
        const items = [];
        if (!ripped) {
          items.push(crab(H, E, t, { x: 560, y: 820, scale: 0.6, eye: 'angry', look: [0.6, -0.6], aL: false }));
          items.push(H.sticker(`<svg viewBox="0 0 20 300" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="0" x2="10" y2="300" stroke="#fff" stroke-width="8" stroke-dasharray="22 16"/></svg>`, 772, 480, 14, { scale: E.pop(t, 0.15), shadow: false }));
          items.push(H.sticker(A.scissors(), 790 + 0, E.lerp(280, 520, E.prog(t, 0.4, 0.55)), 150, { scale: E.pop(t, 0.3), rot: 90 }));
        } else {
          // halves: left half slides to the empty left claw, right half stays; then both grow
          const gs = 0.55 + 0.45 * grow;
          items.push(crab(H, E, t, { x: 560, y: 820, scale: 0.6, eye: t > 3.0 ? 'normal' : 'shocked', look: [0, -0.6], aL: false, aR: false }));
          items.push(H.sticker(A.anemone({ t, half: grow > 0.9 ? 0 : -1 }), E.lerp(760, 300, slide), E.lerp(515, 520, slide), 150 * gs / 0.6, { rot: -10 }));
          items.push(H.sticker(A.anemone({ t: t + 1, half: grow > 0.9 ? 0 : 1 }), 770, 510, 150 * gs / 0.6, { rot: 10 }));
          if (t > 2.9) for (let k = 0; k < 6; k++) items.push(H.sticker(A.sparkle(), [250, 360, 300, 720, 840, 780][k], [400, 440, 600, 400, 430, 600][k], 50, { scale: E.pop(t, 2.9 + k * 0.06) * (0.8 + 0.2 * Math.sin(t * 10 + k)), rot: t * 80 }));
        }
        return items;
      } },

    // G — infinite ammo (real photo + shades)
    { start: 19.9, end: 21.2, bg: () => '', draw: (t, E, H) => {
        const drop = E.out(E.prog(t, 0.15, 0.35));
        return [realCrab(t, E, { cx: 1010, cy: 690, h: 980 - 40 * t }, [
          { svg: A.eyes({ look: [0, 0.3] }), x: 950, y: 605, w: 210 },
          { svg: A.sunglasses(), x: 950, y: E.lerp(150, 605, drop), w: 240 },
          { svg: A.infinity(), x: 1090, y: 1030, w: 260, scale: E.spring(t, 0.5, 0.5) },
        ])];
      } },

    // H — #2 the blanket octopus rises
    { start: 21.2, end: 23.4, bg: (t) => ocean(t + 21), draw: (t, E, H) => {
        const rise = E.out(E.prog(t, 0, 1.4));
        return [octB(H, E, t, { x: 560, y: E.lerp(1500, 830, rise), scale: 0.66, sx: 1 + 0.03 * Math.sin(t * 3), sy: 1 - 0.03 * Math.sin(t * 3), rot: -4 + 3 * Math.sin(t * 1.5), eyePop: E.spring(t, 0.9, 0.5), look: [0.3, 0.2] }),
          label('BLANKET OCTOPUS', 540, 300, E.pop(t, 0.6)), H.sticker(A.badge(2), 130, 160, 170, { scale: E.spring(t, 0.05, 0.5) })];
      } },

    // I — immune to the man o' war
    { start: 23.4, end: 26.5, bg: (t) => ocean(t + 23), draw: (t, E, H) => [
        octB(H, E, t, { x: 290, y: 760, scale: 0.42, rot: -4 + 3 * Math.sin(t * 1.5), sx: 1 + 0.03 * Math.sin(t * 3), look: [0.8, 0], eye: 'normal' }),
        mow(H, E, t, { x: 800, y: 800, scale: 0.6, eyePop: E.spring(t, 0.2, 0.5), look: [-0.7, 0.2], blink: E.blinkAt(t, [1.4]) }),
        label("MAN O' WAR", 800, 330, E.pop(t, 0.35), 3), H.sticker(A.warning(), 975, 330, 90, { scale: E.pop(t, 0.6) }),
        `<div class="lbl" style="left:290px;top:1080px;background:#3CCB5A;color:#fff;transform:translate(-50%,-50%) rotate(-5deg) scale(${E.spring(t, 1.3, 0.5)})">IMMUNE ✓</div>`,
        lensy(H, 890, 1160, 240, { scale: E.spring(t, 1.0, 0.5), pose: 'point', mood: 'smirk', look: [-0.6, -0.2], rot: -8, flip: true }),
      ] },

    // J — tears off tentacles, swings them like whips
    { start: 26.5, end: 31.4, bg: (t) => ocean(t + 26),
      camera: (t, E) => { const s = t > 1.3 ? Math.abs(Math.sin((t - 1.3) * 5)) : 0; const [x, y] = s > 0.97 ? E.shake(t, 10) : [0, 0]; return { x, y }; },
      draw: (t, E, H) => {
        const items = [];
        if (t < 1.25) {
          const yank = E.inn(E.prog(t, 0.35, 0.6));
          items.push(mow(H, E, t, { x: 700, y: 820, scale: 0.6, eye: t > 0.5 ? 'shocked' : 'normal', look: [-0.6, 0.4], tentDx: -900 * yank, tentDy: 150 * yank, tentRot: -40 * yank }));
          items.push(comic('RIP!', 520, 520, 140, E.pop(t, 0.45), -10));
        } else {
          const lt = t - 1.25;
          const swing = 32 * Math.sin(lt * 5), speed = Math.abs(Math.cos(lt * 5));
          items.push(octB(H, E, t, { x: 520, y: 640, scale: 0.6, eye: 'angry', look: [0.6, 0.3], sy: E.breathe(t, 0.02), whip: -70 + 55 * Math.sin(lt * 5), whipBlur: speed > 0.6 ? 18 : 0,
            attach: [{ svg: A.angerVein(), x: 380, y: 560, w: 150, scale: E.pop(lt, 0.3) * (1 + 0.15 * Math.sin(t * 24)) }] }));
          if (speed < 0.25) items.push(H.sticker(A.crack(), Math.sin(lt * 5) > 0 ? 840 : 300, Math.sin(lt * 5) > 0 ? 1150 : 1180, 180, { scale: 1.2 - speed * 3, shadow: false }));
          // fish wanders in and gets whipped away
          const fin = E.out(E.prog(lt, 1.6, 0.6)), fout = E.inn(E.prog(lt, 2.6, 0.6));
          if (lt > 1.6) items.push(fishS(H, E, t, { x: E.lerp(1400, 900, fin) + 700 * fout, y: 1040 - 900 * fout + 300 * fout * fout, scale: 0.34 * (1 - 0.3 * fout), rot: 900 * fout, blur: 25 * fout,
            eye: fout > 0 ? 'shocked' : 'normal', look: [-0.5, 0], white: fout > 0 ? '#9BF06A' : '#fff' }));
          if (fout > 0 && fout < 1) for (let k = 0; k < 4; k++) items.push(H.sticker(A.star('#FFD43B'), 900 + 700 * fout + 90 * Math.cos(t * 12 + k * 1.6), 1040 - 900 * fout + 300 * fout * fout + 60 * Math.sin(t * 12 + k * 1.6), 50, { rot: t * 300 }));
          if (lt > 2.6 && lt < 3.3) items.push(comic('CRACK!', 700, 420, 130, E.pop(lt, 2.6), 8));
        }
        return items;
      } },

    // K — #3 the blue dragon at the surface
    { start: 31.4, end: 33.8, bg: (t) => ocean(t + 31, 1), draw: (t, E, H) => {
        const drift = E.out(E.prog(t, 0, 1.2));
        return [glau(H, E, t, { x: E.lerp(1300, 560, drift), y: 820 + 12 * Math.sin(t * 2), scale: 0.95, rot: -25 + 4 * Math.sin(t * 1.7), eyePop: E.spring(t, 0.9, 0.5), look: [0.2, 0.3], blink: E.blinkAt(t, [1.8]) }),
          H.sticker(A.sparkle(), 300, 560, 80, { scale: E.pop(t, 1.3) * (0.8 + 0.2 * Math.sin(t * 9)), rot: t * 90 }),
          label('BLUE DRAGON', 540, 330, E.pop(t, 0.6)), H.sticker(A.badge(3), 130, 160, 170, { scale: E.spring(t, 0.05, 0.5) })];
      } },

    // L — eats the man o' war, keeps its stingers
    { start: 33.8, end: 37.9, bg: (t) => ocean(t + 33),
      camera: (t, E) => { const bite = [1.2, 1.7, 2.2].some((b) => t > b && t < b + 0.15); const [x, y] = bite ? E.shake(t, 12) : [0, 0]; return { x, y }; },
      draw: (t, E, H) => {
        const bites = [1.2, 1.7, 2.2].filter((b) => t > b).length;
        const app = E.out(E.prog(t, 0, 1.0));
        const items = [
          mow(H, E, t, { x: 720, y: 760, scale: 0.6 * (1 - 0.17 * bites), eye: bites ? 'shocked' : 'normal', look: [-0.7, 0.2], attach: bites ? [{ svg: A.sweat(), x: 720, y: 120, w: 90 }] : [] }),
          glau(H, E, t, { x: E.lerp(-200, 330, app), y: 900, scale: 0.68, rot: -40 + 8 * Math.sin(t * 6), eye: bites ? 'heart' : 'normal', look: [0.8, -0.3] }),
        ];
        if (t > 1.2 && t < 2.6) items.push(comic('CHOMP!', 560, 420, 140, E.pop(t, 1.2) * (1 + 0.08 * Math.sin(t * 20)), -8));
        if (t > 2.6) for (let k = 0; k < 6; k++) { const p = E.prog(t, 2.6 + k * 0.12, 0.6); if (p > 0 && p < 1) items.push(H.sticker(A.stinger(), E.lerp(700, 360, p), E.lerp(720, 880, p) - 140 * Math.sin(p * Math.PI), 70, { rot: p * 360 })); }
        return items;
      } },

    // M — stores them in its fingertips (Lensy magnifier) → stronger
    { start: 37.9, end: 43.0, bg: (t, E, H) => H.tealBg(1 + 0.01 * t), draw: (t, E, H) => {
        const items = [glau(H, E, t, { x: 560, y: 820, scale: 0.95, rot: -25, look: [0.2, 0.3], blink: E.blinkAt(t, [1.0]) })];
        const lin = E.out(E.prog(t, 0.2, 0.7));
        const LX = E.lerp(1300, 420, lin), LY = E.lerp(400, 600, lin), R = 175;
        if (t < 3.0) {
          // magnified view: target = a ceras cluster at image (511,415). Screen pos of that point in the glaucus puppet:
          const sc = 0.95, ang = -25 * Math.PI / 180, dx = (511 - 540) * sc, dy = (415 - 503) * sc;
          const tx = 560 + dx * Math.cos(ang) - dy * Math.sin(ang), ty = 820 + dx * Math.sin(ang) + dy * Math.cos(ang);
          const Z = 3.2;
          let inner = H.puppet(GLAU, { x: LX - (tx - 560) * Z, y: LY - (ty - 820) * Z, scale: sc * Z, rot: -25, parts: {} });
          for (let k = 0; k < 7; k++) {
            const a = k * 0.9, rr = 40 + (k % 3) * 45;
            inner += H.sticker(A.stinger(), LX + Math.cos(a) * rr, LY + Math.sin(a) * rr, 64, { scale: E.pop(t, 1.0 + k * 0.08) * (0.85 + 0.15 * Math.sin(t * 12 + k)), shadow: false });
          }
          items.push(`<div style="position:absolute;left:${LX - R}px;top:${LY - R}px;width:${2 * R}px;height:${2 * R}px;border-radius:50%;overflow:hidden;background:#1C6762;opacity:${lin}">
            <div style="position:absolute;left:${-(LX - R)}px;top:${-(LY - R)}px;width:1080px;height:1920px">${inner}</div></div>`);
          items.push(H.sticker(lensRing(), LX + 25, LY + 185, 480 * 0.94, { rot: -10, opacity: lin }));
          items.push(H.sticker(A.eyes({ look: [0, 0.7], blink: E.blinkAt(t, [2.0]) }), LX, LY - R + 62, 125, { scale: E.pop(t, 0.7), opacity: 0.92, shadow: false }));
        } else {
          // power bars
          const b1 = E.out(E.prog(t, 3.2, 0.5)), b2 = E.out(E.prog(t, 3.6, 0.7));
          const bar = (y, w, col, txt, img) => `<div style="position:absolute;left:120px;top:${y}px;width:840px;height:120px;border:8px solid #111;border-radius:24px;background:rgba(255,255,255,.85);overflow:hidden">
            <div style="width:${w}%;height:100%;background:${col}"></div></div><div class="lbl" style="left:120px;top:${y - 62}px;font-size:42px">${txt}</div>`;
          items.length = 0;
          items.push(bar(560, 55 * b1, '#9B7CFF', "MAN O' WAR"), bar(860, 100 * b2, '#2BB6FF', 'BLUE DRAGON'));
          items.push(H.sticker(A.crack(), 960, 920, 200, { scale: E.pop(t, 4.2), shadow: false }));
          items.push(comic('POWER UP!', 540, 1100, 120, E.pop(t, 4.25), -6));
          items.push(lensy(H, 880, 330, 240, { scale: E.spring(t, 3.1, 0.5), mood: 'shock', pose: 'shock' }));
        }
        return items;
      } },

    // N — the man o' war needs better security
    { start: 43.0, end: 48.0, bg: (t) => ocean(t + 43), draw: (t, E, H) => [
        mow(H, E, t, { x: 470, y: 880, scale: 0.6, eye: 'sad', look: [0.3, 0.6], tentHide: true, sy: E.breathe(t, 0.02), attach: [{ svg: A.sweat(), x: 720, y: 120, w: 90 }] }),
        H.sticker(A.sign('SECURITY', 'WANTED!'), 850, 700, 330, { scale: E.spring(t, 2.0, 0.6), rot: 6 }),
        lensy(H, 830, 1120, 280, { scale: E.spring(t, 2.6, 0.5), mood: 'laugh', pose: 'cheer', t, rot: -6 + 4 * Math.sin(t * 10) }),
      ] },
  ],
};
</script>
