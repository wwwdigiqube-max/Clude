<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Luckiest Guy';src:url(../node_modules/@fontsource/luckiest-guy/files/luckiest-guy-latin-400-normal.woff2)}
body{margin:0;background:#7a9a6a;font-family:'Luckiest Guy';}
.g{display:grid;grid-template-columns:repeat(5,260px);gap:18px;padding:24px}
.c{background:#5d7d55;border-radius:16px;height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:22px}
.c div{width:200px;height:170px;display:flex;align-items:center;justify-content:center}.c svg{max-width:200px;max-height:170px}
</style><script src="assets.js"></script></head><body><div class="g" id="g"></div>
<script>
const A=Assets, items=[
['eyes normal',A.eyes({look:[0.3,0.2]})],['eyes shocked',A.eyes({variant:'shocked'})],['eyes angry',A.eyes({variant:'angry',look:[-0.3,0.3]})],['eyes heart',A.eyes({variant:'heart'})],['eyes sad',A.eyes({variant:'sad',look:[0,0.5]})],
['hand',A.hand()],['straw hat',A.strawHat()],['cowbell',A.cowbell()],['honeydew',A.drop()],['sparkle',A.sparkle()],
['shield',A.shield()],['spear',A.spear()],['ladybug',A.ladybugCartoon()],['snow + temp',A.snowflake()+A.thermometer()],['cactus',A.cactus({droop:1})],
['bubble',A.bubble('MOO!')],['eyes blink',A.eyes({blink:0.7})]];
document.getElementById('g').innerHTML=items.map(([n,s])=>`<div class="c"><div>${s}</div>${n}</div>`).join('');
</script></body></html>
